name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Python and shell syntax
        run: |
          python3 -m py_compile src/ubuntu/server.py src/pi/controller/switchd.py src/pi/session/patch_launcher.py scripts/setup.py
          bash -n src/pi/kiosk/launch-viewer.sh src/pi/session/minimal-session.sh scripts/install-ubuntu.sh scripts/install-pi.sh scripts/rollback-ubuntu.sh scripts/rollback-pi.sh
          bash scripts/install-ubuntu.sh --dry-run --container-mode existing --container spotify-headless
          bash scripts/install-pi.sh --dry-run --profile standalone --ssh-host ubuntu.example.lan --ssh-user spotify
          bash scripts/install-pi.sh --dry-run --profile companion --ssh-host ubuntu.example.lan --ssh-user spotify
      - name: JavaScript syntax and fixtures
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          for test in tests/*.js; do node "$test"; done